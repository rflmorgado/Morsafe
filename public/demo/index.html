<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MorSafe — Demonstração interativa</title>
<meta name="description" content="Teste o MorSafe na prática: registre uma entrega de EPI, assine na tela e veja a ficha gerada. Empresa fictícia, nada é salvo.">
<link rel="icon" href="/icon.png">
<style>
:root{
  --fg:#16241c;--brand-50:#f3faf5;--brand-100:#e5f3ea;--brand-200:#c7e4d1;--brand-300:#9bcdae;--brand-400:#5cb37e;--brand-500:#34a05e;--brand-600:#278049;--brand-700:#1f6338;--brand-800:#1a4d2e;--brand-900:#123524;--brand-950:#0d2b1c;
  --surface:#fff;--muted:#f4f7f5;--line:#e0e9e3;--line2:#c7d6cd;--t2:#5c6b62;--t3:#93a29a;
  --danger-bg:#fdecea;--danger:#b3261e;--warn-bg:#fef6e0;--warn:#8a5a00;
  --c1:#2a78d6;--c2:#eb6834;--c3:#4a3aa7;--c4:#eda100;--c5:#e87ba4;
  --card:0 1px 2px rgba(18,53,36,.04),0 6px 16px rgba(18,53,36,.07);
  --btn:0 1px 2px rgba(18,53,36,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--fg);background:var(--muted);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hide{display:none!important}

/* banner */
#banner{background:var(--brand-950);color:#fff;font-size:12.5px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;text-align:center;position:sticky;top:0;z-index:60}
#banner b{color:#9bf0b5}
#banner button,#banner a{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;text-decoration:none}
#banner a.cta{background:#fff;color:var(--brand-900);border-color:#fff}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 41px)}
#side{background:var(--brand-950);color:#d7e8dd;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:41px;height:calc(100vh - 41px);overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:2px 6px 14px;font-weight:700;font-size:19px;letter-spacing:-.3px}
.logo img{width:30px;height:30px;object-fit:contain}
.logo span{color:#fff}.logo span b{color:#4fd37e}
.empresa{background:rgba(255,255,255,.07);border-radius:11px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#a9c4b5}
.empresa b{display:block;color:#fff;font-size:13px}
.sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7f9c8b;font-weight:700;padding:12px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#d7e8dd;font-weight:500;font-size:13.5px;background:none;border:0;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:#a9c4b5}
.side-foot b{display:block;color:#fff;font-size:13px}
#main{padding:26px 30px 60px;min-width:0}
.topbar{display:none}
.page-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h .ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--brand-400),var(--brand-600));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--btn)}
.page-h .ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page-h h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.page-h p{color:var(--t2);font-size:13.5px;max-width:640px;margin-top:2px}
.page-h .grow{flex:1;min-width:220px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:#fff;box-shadow:var(--btn);white-space:nowrap}
.btn:hover{border-color:var(--brand-500);color:var(--brand-700)}
.btn.pri{background:linear-gradient(180deg,var(--brand-700),var(--brand-800));border-color:var(--brand-800);color:#fff}
.btn.pri:hover{background:var(--brand-800);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,160,94,.55)}70%{box-shadow:0 0 0 12px rgba(52,160,94,0)}100%{box-shadow:0 0 0 0 rgba(52,160,94,0)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13.5px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-200);border-color:var(--brand-500)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}

/* cards */
.card{background:#fff;border-radius:16px;box-shadow:var(--card);border:1px solid #edf2ee}
.pad{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px;border-top:3px solid var(--brand-500);position:relative;min-height:112px}
.kpi.w{border-top-color:#a86a00}.kpi.d{border-top-color:#c93a2f}
.kpi small{display:block;color:var(--t2);font-size:12.5px;max-width:70%}
.kpi strong{display:block;font-size:24px;margin-top:6px;letter-spacing:-.4px}
.kpi .ki{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--brand-400),var(--brand-600));display:flex;align-items:center;justify-content:center}
.kpi.w .ki{background:linear-gradient(145deg,#c98a1b,#8a5a00)}.kpi.d .ki{background:linear-gradient(145deg,#e0594d,#b3261e)}
.kpi .ki svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;background:var(--brand-100);color:var(--brand-800);margin-top:8px}
.pill.w{background:var(--warn-bg);color:var(--warn)}.pill.d{background:var(--danger-bg);color:var(--danger)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
.ct{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;margin-bottom:12px}
.ct i{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--brand-400),var(--brand-600));display:inline-flex;align-items:center;justify-content:center}
.ct i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.donut{display:block;margin:4px auto 10px;width:150px;height:150px}
.legend{display:grid;gap:5px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}.legend em{margin-left:auto;font-style:normal;color:var(--t2);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bars{display:flex;gap:12px;align-items:flex-end;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px;font-size:12px;color:var(--t2);font-weight:600}
.bars .b span{font-weight:700;color:var(--fg)}
.bars .b div{width:100%;background:var(--brand-500);border-radius:6px 6px 0 0;min-height:3px}
.bars .b.now div{background:var(--brand-500)}.bars .b:not(.now) div{background:#7cc79a}
.hbar{margin:9px 0}.hbar header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.hbar .t{height:9px;border-radius:9px;background:var(--brand-100)}.hbar .t div{height:100%;border-radius:9px;background:var(--brand-600)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f0f4f1;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;margin-right:9px;flex:none;vertical-align:middle}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--brand-100);color:var(--brand-800)}
.tag.w{background:var(--warn-bg);color:var(--warn)}.tag.d{background:var(--danger-bg);color:var(--danger)}.tag.g{background:#eceeed;color:#59635d}
.ib{background:none;border:0;padding:5px;border-radius:7px;color:var(--t2);display:inline-flex}
.ib:hover{background:var(--brand-50);color:var(--brand-700)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--t2)}.sm{font-size:12px}
.list .it{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid #f0f4f1;align-items:flex-start}
.list .it:last-child{border-bottom:0}
.list .dt{width:9px;height:9px;border-radius:50%;background:var(--brand-500);margin-top:7px;flex:none}
.list .dt.g{background:#9aa39e}.list .dt.w{background:#a86a00}
.list b{font-weight:600}.list .who{color:var(--brand-700);font-weight:600;margin-left:6px}
.list .meta{font-size:12.5px;color:var(--t2);margin-top:2px}
.list .go{margin-left:auto;flex:none}
.empty{padding:26px;text-align:center;color:var(--t3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:10px}
.tabs button{background:none;border:0;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--t2);font-size:13px}
.tabs button.on{background:var(--brand-800);color:#fff}
.rx{display:grid;grid-template-columns:1fr 1fr;gap:14px 36px}
.rx div{font-size:13px;color:var(--t2)}.rx b{color:var(--fg)}.rx em{font-style:normal;color:var(--t3)}
.ok{color:var(--brand-600)}.crit{color:#c93a2f}.att{color:#a86a00}
.note{font-size:12.5px;color:var(--t2);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}

/* modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none;background:rgba(13,43,28,.55);padding:20px;overflow:auto}
#modal-root.on{display:block}
.modal{background:#fff;border-radius:18px;max-width:560px;margin:24px auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:720px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:17px}
.modal .body{padding:18px 22px 22px}
.f{display:grid;gap:5px;margin-bottom:14px}
.f label{font-size:12.5px;font-weight:600;color:var(--t2)}
.f select,.f input,.f textarea{width:100%}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--muted)}
.item .fr3{display:grid;grid-template-columns:1.5fr 1fr 90px;gap:10px}
.saldo{font-size:12px;color:var(--t2);margin-top:5px}
.saldo.bad{color:var(--danger);font-weight:600}
.sigbox{border:1.5px dashed var(--line2);border-radius:12px;background:#fff;position:relative;touch-action:none}
.sigbox canvas{display:block;width:100%;height:150px;border-radius:12px;cursor:crosshair}
.sigbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px;pointer-events:none}
.sigbox .clr{position:absolute;right:8px;top:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font-size:13px;flex:1;min-width:200px;cursor:pointer;background:#fff}
.seg input{margin-top:3px;accent-color:var(--brand-700);width:auto;flex:none}
.err{background:var(--danger-bg);color:var(--danger);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.success{text-align:center;padding:8px 0 4px}
.success .big{width:64px;height:64px;border-radius:50%;background:var(--brand-100);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.success .big svg{width:32px;height:32px;stroke:var(--brand-600);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* tablet overlay */
#tablet{position:fixed;inset:0;z-index:120;background:rgba(13,43,28,.72);display:none;align-items:center;justify-content:center;padding:16px}
#tablet.on{display:flex}
.tab-dev{background:#0f1a14;border-radius:28px;padding:16px;width:100%;max-width:460px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.tab-scr{background:#fff;border-radius:16px;padding:20px;max-height:86vh;overflow:auto}
.tab-scr h3{font-size:16px;margin:2px 0 4px}

/* ficha */
#ficha-root{position:fixed;inset:0;z-index:110;background:rgba(13,43,28,.6);display:none;overflow:auto;padding:16px}
#ficha-root.on{display:block}
.fbar{max-width:794px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet{max-width:794px;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:44px 48px 30px;font-size:12.5px;color:#222;position:relative}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.sheet .top img{width:54px;height:54px;object-fit:contain}
.sheet .top .tg{font-size:10.5px;color:#777;font-style:italic;text-align:right;margin-top:10px}
.sheet h2{color:var(--brand-900);font-size:24px;margin-top:14px;letter-spacing:-.4px}
.sheet .emp{color:var(--t2);margin-bottom:12px}
.sheet hr{border:0;border-top:1px solid #ccc;margin:12px 0}
.sheet h4{font-size:14px;margin:12px 0 5px}
.sheet .nome{font-size:16px;font-weight:700}
.sheet .termo{font-size:11.5px;line-height:1.5;color:#333;text-align:justify}
.hist{width:100%;margin-top:8px}
.hist .h{display:grid;grid-template-columns:1fr 150px;gap:14px;padding:9px 0;border-bottom:1px solid #e3e3e3;align-items:center}
.hist .h b{font-size:12.5px}.hist .h small{display:block;color:#555;font-size:11px}
.hist .sg{text-align:center}.hist .sg svg,.hist .sg img{height:38px;max-width:140px;object-fit:contain}
.hist .hh{font-size:10.5px;text-align:right;font-weight:700;color:#444;padding-bottom:4px;border-bottom:1px solid #aaa}
.val{margin-top:16px;padding-top:12px;border-top:1px solid #d8d8d8;font-size:11px;color:#555;display:flex;gap:14px;align-items:flex-start}
.val .qr{width:78px;height:78px;flex:none}.val .qr svg{width:100%;height:100%}
.val b{color:var(--brand-800)}
.demo-mark{position:absolute;right:20px;top:14px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#c93a2f;border:1.5px solid #c93a2f;border-radius:6px;padding:2px 7px;transform:rotate(4deg)}

/* roteiro */
#roteiro{position:fixed;right:16px;bottom:16px;z-index:70;width:290px;max-width:calc(100vw - 32px)}
#roteiro .box{background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(13,43,28,.28);border:1px solid var(--line);overflow:hidden}
#roteiro header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--brand-900);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
#roteiro .steps{padding:10px 14px 14px;display:grid;gap:9px;font-size:13px}
#roteiro .s{display:flex;gap:9px;align-items:flex-start;color:var(--t2)}
#roteiro .s i{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
#roteiro .s.done{color:var(--fg)}#roteiro .s.done i{background:var(--brand-600);border-color:var(--brand-600)}
#roteiro .s.done i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#roteiro .fin{margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand-950);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:41px;bottom:0;width:260px;z-index:90;transform:translateX(-100%);transition:transform .2s;height:auto}
  #side.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  #main{padding:16px 14px 90px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700}
  .topbar button{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;display:inline-flex}
  .topbar svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round}
  .grid2,.grid3,.rx{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi strong{font-size:20px}
  #roteiro{width:auto;left:12px;right:12px;bottom:10px}
  .sheet{padding:26px 18px}
  .hist .h{grid-template-columns:1fr 100px}
  .fr,.item .fr3{grid-template-columns:1fr}
}
@media print{
  #banner,#side,#roteiro,#toast,.topbar,.btn,#modal-root,#tablet{display:none!important}
  .app{display:block}#main{padding:0}
  body{background:#fff}
  body.pf .app{display:none}
  #ficha-root.on{position:static;background:#fff;padding:0;overflow:visible;display:block}
  body:not(.pf) #ficha-root{display:none}
  .fbar{display:none!important}
  .sheet{box-shadow:none;max-width:none;padding:10mm 12mm;border-radius:0}
  @page{size:A4;margin:8mm}
}
</style>
</head>
<body>

<div id="banner">
  <span><b>Demonstração com dados fictícios</b> — a empresa, as pessoas e os C.A. são inventados e nada do que você fizer aqui é salvo.</span>
  <button id="btn-reset" type="button">Reiniciar demo</button>
  <a class="cta" id="btn-wa" target="_blank" rel="noopener noreferrer" href="#">Falar com a gente →</a>
</div>

<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="ficha-root"></div>
<div id="tablet"></div>
<div id="roteiro"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ===== utilidades ===== */
var WA="https://wa.me/5511927500869?text="+encodeURIComponent("Olá! Vi a demonstração do MorSafe e quero conhecer.");

var pad=null;
function makePad(el){
  var cv=el.querySelector("canvas"),ph_=el.querySelector(".ph"),ctx,drawing=false,ink=false,last;
  function size(){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1b2a6b"}
  size();
  function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.addEventListener("pointerdown",function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke();ink=true;ph_.style.display="none"});
  cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pos(e),mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};ctx.quadraticCurveTo(last.x,last.y,mid.x,mid.y);ctx.stroke();ctx.beginPath();ctx.moveTo(mid.x,mid.y);last=p});
  function end(){drawing=false}
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  el.querySelector(".clr").addEventListener("click",function(){ctx.clearRect(0,0,cv.width,cv.height);ink=false;ph_.style.display=""});
  return{hasInk:function(){return ink},data:function(){return cv.toDataURL("image/png")},clear:function(){el.querySelector(".clr").click()}}}
function sigBox(){return '<div class="sigbox" id="sig"><canvas></canvas><div class="ph">Assine aqui com o dedo ou o mouse</div><button type="button" class="btn sm clr">Limpar</button></div>'}

  else if(a==="salvarDev"){

    if(!c||!e)return err("Selecione o colaborador e o EPI.");if(q<1)return err("Informe a quantidade.");if(!pad.hasInk())return err("A assinatura do colaborador é obrigatória.");
    var dest=$("#v-dest").value;if(dest==="reaproveitamento")epiById(e).saldo+=q;
    S.movs.push({id:S.next++,tipo:"devolucao",colab:+c,epi:+e,qtd:q,motivo:$("#v-mot").value,destino:dest,dt:new Date().toISOString(),grupo:"g"+S.next,por:"Admin Demo",assin:{img:pad.data()}});

    var e3=$("#n-epi").value,q3=parseInt($("#n-qtd").value,10)||0,cu=parseFloat($("#n-custo").value);

    ep.custo=((ep.custo*Math.max(ep.saldo,0))+(cu*q3))/(Math.max(ep.saldo,0)+q3);ep.saldo+=q3;

    closeModal();route();toast("Colaborador cadastrado. Já dá para entregar EPI para ele.")}
  else if(a==="salvarEpi"){

    var ca=$("#p-ca").value.trim(),val=$("#p-val").value;if(ca&&!val)return err("Informe a validade do C.A.");

    closeModal();route();toast("EPI cadastrado.")}
  else if(a==="csv"){
    var rows=[["Tipo","Data","Colaborador","EPI","Quantidade","Motivo"]].concat(S.movs.slice().sort(function(x,y){return new Date(y.dt)-new Date(x.dt)}).map(function(m){return [m.tipo,fmtDT(m.dt),colById(m.colab).nome,epiById(m.epi).nome,m.qtd,m.tipo==="entrega"?MOTIVO_E[m.motivo]:(m.motivo?MOTIVO_D[m.motivo]:"")]}));
    var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(";")}).join("\n"),b=new Blob(["﻿"+csv],{type:"text/csv"}),u=document.createElement("a");u.href=URL.createObjectURL(b);u.download="movimentacoes-demo.csv";u.click()}
  else if(a==="mais"){S.filtro.mlim=(S.filtro.mlim||12)+12;route()}
  else if(a==="baixo"){S.filtro.baixo=!S.filtro.baixo;route()}
  else if(a==="atab"){S.filtro.atab=t.dataset.t;route()}
  else if(a==="print"){var pf=$("#ficha-root").classList.contains("on");if(pf)document.body.classList.add("pf");window.print();setTimeout(function(){document.body.classList.remove("pf")},800)}
  else if(a==="rot"){rotUser=true;rotAberto=!rotAberto;renderRoteiro()}
});
document.addEventListener("change",function(ev){
  var id=ev.target.id,f=S.filtro,m={cs:"cs",cn:"cn",et:"et",mt:"mt",mc:"mc",me:"me"};
  if(m[id]){f[m[id]]=ev.target.value;f.mlim=12;route();return}
  if(ev.target.name==="modo"){$("#sigwrap").classList.toggle("hide",ev.target.value==="estacao");return}
  if(!rendering&&ev.target.closest&&ev.target.closest("#itens")){lerDraft();renderItens()}
});
document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="cq"||id==="eq"){S.filtro[id]=ev.target.value;var p=ev.target.selectionStart;route();var el=$("#"+id);el.focus();el.setSelectionRange(p,p)}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){closeModal();$("#ficha-root").classList.remove("on");$("#tablet").classList.remove("on")}});
$("#btn-wa").href=WA;
$("#btn-reset").addEventListener("click",function(){S=seed();closeModal();$("#ficha-root").classList.remove("on");$("#tablet").classList.remove("on");route();renderRoteiro();toast("Demonstração reiniciada.")});
window.addEventListener("hashchange",route);window.addEventListener("afterprint",function(){document.body.classList.remove("pf")});
S=seed();route();renderRoteiro();
})();
</script>
